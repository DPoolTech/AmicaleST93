<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amicale ST93</title>
<meta name="description" content="Amicale ST93 : actualités, agenda, boutique et contact.">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --fond:#000;
  --card:rgba(15,30,61,.94);--txt:#eef1f8;--mut:#a9b4cf;--acc:#7fa8ff;--acc2:#e0233f;--bd:rgba(255,255,255,.12);
  --gold:#d8b45c;color-scheme:dark
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
body{margin:0;color:var(--txt);font:16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--fond) fixed;min-height:100vh}
/* Fond d'écran (image facultative, voir FOND_ECRAN) */
body.avec-fond{background-size:cover;background-position:center;background-attachment:fixed}
body.avec-fond::before{content:"";position:fixed;inset:0;background:rgba(8,14,32,.55);z-index:-1}
h1,h2{font-family:"Playfair Display",Georgia,"Times New Roman",serif}

nav{position:sticky;top:0;z-index:20;padding:env(safe-area-inset-top,0px) 8px 0;background:rgba(10,18,40,.88);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(216,180,92,.35);box-shadow:0 4px 16px rgba(0,0,0,.35)}
.nav-in{display:flex;justify-content:center;gap:6px;max-width:780px;margin:0 auto}
nav a{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;
  color:#fff;text-decoration:none;font-size:.92rem;font-weight:600;letter-spacing:.02em;opacity:.78;border-radius:10px 10px 0 0;
  transition:opacity .15s,background .15s,color .15s;-webkit-tap-highlight-color:transparent}
nav a::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--gold);transform:scaleX(0);transition:transform .2s}
nav a:hover{background:rgba(255,255,255,.09);opacity:1}
nav a[aria-current]{opacity:1;color:var(--gold)}
nav a[aria-current]::after{transform:scaleX(1)}
.nav-ico{font-size:1.05rem;line-height:1}
@media (max-width:520px){
  nav{padding-left:2px;padding-right:2px}
  .nav-in{gap:0}
  nav a{flex:1;flex-direction:column;gap:1px;padding:6px 2px;min-height:54px;font-size:.72rem;letter-spacing:0}
  .nav-ico{font-size:1.25rem}
  nav a::after{left:22%;right:22%}
}

.bandeau{background:#000;line-height:0}
.bandeau img{display:block;width:100%;max-width:1400px;margin:0 auto;height:auto}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.wrap{max-width:780px;margin:0 auto;padding:20px 16px 8px}
section{background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid var(--bd);border-radius:18px;padding:22px;margin:20px 0;box-shadow:0 10px 30px rgba(0,0,0,.18)}
h2{margin:0 0 14px;font-size:1.4rem;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
.intro{color:var(--mut);margin:-4px 0 14px}

.news{padding:16px 18px;margin:0 0 18px;background:rgba(255,255,255,.06);border:1px solid var(--bd);border-left:5px solid var(--c,var(--gold));border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.news:last-child{margin-bottom:0}
.news h3{margin:0 0 4px;font-family:"Playfair Display",Georgia,serif;font-size:1.3rem;color:var(--c,var(--gold))}
.news .tag{padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--c,var(--gold))}
.tag{font-size:.82rem;color:var(--mut)}
.news p{margin:6px 0;white-space:pre-line}
.news-corps{flex:1;min-width:0}
.news.avec-image{display:flex;gap:18px;align-items:flex-start}
.news-fig{flex:0 0 38%;width:38%;margin:0}
.zoom{display:block;width:100%;padding:0;border:0;background:none;border-radius:12px;cursor:zoom-in}
.zoom img{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:12px}
.news-fig figcaption{margin-top:5px;text-align:center;font-size:.72rem;color:var(--mut);opacity:.85}
@media (max-width:560px){
  .news.avec-image{flex-direction:column}
  .news-fig{flex:none;width:100%}
  .zoom img{max-height:240px}
}
.news-texte{line-height:1.6}
.news-texte.coupe:not(.ouvert){max-height:calc(var(--news-lignes,7) * 1.6em + 6px);overflow:hidden;-webkit-mask-image:linear-gradient(#000 62%,transparent);mask-image:linear-gradient(#000 62%,transparent)}
.plus{margin:2px 0 6px;padding:4px 0;border:0;background:none;color:var(--acc);font:inherit;font-size:.92rem;font-weight:600;cursor:pointer}
.plus:hover{text-decoration:underline}
.pg{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.pg button{min-width:42px;padding:8px 13px;border-radius:10px;border:1px solid var(--bd);background:rgba(255,255,255,.06);color:var(--txt);font:inherit;font-weight:600;cursor:pointer}
.pg button:hover:not(:disabled){border-color:var(--gold)}
.pg button[aria-current="page"]{background:var(--gold);color:#1a1a1a;border-color:var(--gold)}
.pg button:disabled{opacity:.4;cursor:default}
.note:focus-visible,.plus:focus-visible,.zoom:focus-visible,.pg button:focus-visible,.lb-x:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#epingles{display:flex;flex-direction:column;gap:8px}
#epingles-zone{padding:12px 16px 16px}
.note{display:flex;align-items:center;gap:10px;width:100%;padding:9px 14px;border:1px solid color-mix(in srgb,var(--c,var(--gold)) 50%,transparent);border-left:4px solid var(--c,var(--gold));border-radius:10px;background:rgba(15,30,61,.97);background:color-mix(in srgb,var(--c,var(--gold)) 14%,#0f1e3d);color:var(--txt);font:inherit;text-align:left;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.note:hover{background:color-mix(in srgb,var(--c,var(--gold)) 22%,#0f1e3d)}
.note-pin{display:inline-block;flex:none;transform:rotate(20deg)}
.note-t{flex:1;min-width:0;font-weight:600;font-size:.95rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note-go{flex:none;font-size:.82rem;font-weight:700;color:var(--c,var(--gold))}
.news{scroll-margin-top:72px}
.news:focus{outline:none}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--c,var(--gold)),0 4px 14px rgba(0,0,0,.25)}100%{box-shadow:0 4px 14px rgba(0,0,0,.25)}}
.news.flash{animation:flash 1.8s ease-out}
.pin{display:inline-block;margin:0 0 8px;padding:2px 11px;border-radius:999px;font-size:.78rem;font-weight:700;color:#1a1a1a;background:var(--c,var(--gold))}
#lightbox{border:0;padding:0;background:transparent;width:100%;height:100%;max-width:none;max-height:none;color:var(--txt)}
#lightbox::backdrop{background:rgba(5,10,25,.92)}
#lightbox .lb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;height:100%;padding:16px;cursor:zoom-out}
#lightbox img{max-width:95vw;max-height:calc(100vh - 90px);object-fit:contain;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
#lightbox p{margin:0;font-size:.9rem;color:var(--mut);text-align:center}
.lb-x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:rgba(255,255,255,.14);color:#fff;font-size:1.6rem;line-height:1;cursor:pointer}
.news a{color:var(--acc);font-weight:600;text-decoration:none}
.news a:hover{text-decoration:underline}
.news.rouge h3,.news.rouge p{color:#ff6b5e}
.news.rouge{border-left-color:#ff6b5e}
.news.rouge .tag{border-bottom-color:#ff6b5e}
.c-rouge{--c:#ff6b5e}.c-bleu{--c:var(--acc)}.c-vert{--c:#5fd39a}.c-blanc{--c:#eef1f8}.c-violet{--c:#b79bff}.c-turquoise{--c:#4fd6d0}.c-orange{--c:#ff9f5a}

.ev{display:flex;gap:16px;align-items:center;padding:16px 18px;margin:0 0 18px;background:rgba(255,255,255,.06);border:1px solid var(--bd);border-left:5px solid var(--acc2);border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.ev:last-child{margin-bottom:0}
.ev.prochain{border-left-color:var(--gold);background:rgba(216,180,92,.10)}
.ev-corps{flex:1;min-width:0}
.ev-titre{display:block;font-family:"Playfair Display",Georgia,serif;font-size:1.3rem;font-weight:700;color:var(--gold);line-height:1.25}
.ev .tag{font-size:.92rem;margin-top:2px}
.ev-delai{display:inline-block;margin-top:8px;padding:2px 12px;border-radius:999px;font-size:.8rem;font-weight:600;background:rgba(224,35,63,.18);color:#ff9aa9;border:1px solid rgba(224,35,63,.45)}
.ev.prochain .ev-delai{background:rgba(216,180,92,.18);color:var(--gold);border-color:rgba(216,180,92,.5)}
.badge{flex:0 0 76px;text-align:center;border-radius:12px;overflow:hidden;border:1px solid var(--bd);background:var(--card);box-shadow:0 3px 10px rgba(0,0,0,.3)}
.badge b{display:block;font-size:2rem;line-height:1.1;padding:8px 0 4px;font-family:"Playfair Display",Georgia,serif}
.badge span{display:block;background:var(--acc2);color:#fff;font-size:.8rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:4px 0}
.ev.prochain .badge span{background:var(--gold);color:#1a1a1a}
.ev.cc{border-left-color:var(--c)}
.ev.cc .ev-delai{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);border-color:color-mix(in srgb,var(--c) 50%,transparent)}
.ev.cc .badge span{background:var(--c);color:#1a1a1a}

.boutique{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.carte{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:24px 16px 18px;border-radius:16px;color:#fff;text-decoration:none;
  background:linear-gradient(160deg,rgba(127,168,255,.24),rgba(22,55,111,.6));border:1px solid rgba(127,168,255,.38);
  box-shadow:0 6px 18px rgba(0,0,0,.3);transition:transform .15s,box-shadow .15s,border-color .15s}
.carte.alt{background:linear-gradient(160deg,rgba(224,35,63,.3),rgba(138,13,32,.6));border-color:rgba(224,35,63,.55)}
.carte:hover{transform:translateY(-4px);box-shadow:0 14px 26px rgba(0,0,0,.45);border-color:var(--gold)}
.carte-ico{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.14);font-size:2rem;line-height:1;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.carte-titre{font-family:"Playfair Display",Georgia,serif;font-size:1.2rem;font-weight:700;line-height:1.25}
.carte-desc{font-size:.9rem;color:var(--mut)}
.carte-go{margin-top:auto;padding-top:8px;font-size:.9rem;font-weight:600;color:var(--gold)}
.carte.horizontale{flex-direction:row;text-align:left;gap:16px;padding:18px 20px}
.carte.horizontale .carte-go{margin:0 0 0 auto;padding:0;white-space:nowrap}
.carte.horizontale .carte-ico{flex:0 0 64px}
.carte.horizontale .carte-corps{display:flex;flex-direction:column;gap:2px;min-width:0}
.agenda-bandeau{position:relative;background:linear-gradient(180deg,#0b1530,#142a57 60%,#0b1530);
  border-top:1px solid rgba(216,180,92,.35);border-bottom:2px solid var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.45)}
.agenda-inner{max-width:1100px;margin:0 auto;padding:8px 16px 8px}
.agenda-titre{font-family:"Playfair Display",Georgia,serif;font-size:.85rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);
  display:flex;align-items:center;gap:12px;margin-bottom:6px}
.agenda-titre::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
.agenda-piste{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;justify-content:safe center;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--gold) transparent}
.agenda-piste .ev{flex:0 0 auto;margin:0;scroll-snap-align:start}
.agenda-piste .empty{padding:2px 0}
.agenda-piste .ev{flex-basis:min(78vw,260px);gap:12px;padding:8px 12px;border-left-width:4px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.agenda-piste .badge{flex:0 0 54px}
.agenda-piste .badge span{font-size:.7rem;padding:2px 0}
.agenda-piste .ev-titre{font-size:1.05rem}
.agenda-piste .ev .tag{font-size:.8rem;margin-top:0;line-height:1.35}
.agenda-piste .ev{padding:6px 12px}
.agenda-piste .ev-date{flex:0 0 60px;display:flex;flex-direction:column;align-items:center;gap:2px}
.agenda-piste .badge{flex:none;width:54px}
.agenda-piste .badge b{display:flex;align-items:center;justify-content:center;height:28px;padding:0 0 1px;font-size:1.25rem;line-height:1;font-variant-numeric:lining-nums;font-feature-settings:"lnum"}
.agenda-piste .badge span{font-size:.65rem;line-height:1.2;padding:1px 0}
.agenda-piste .ev .ev-delai{display:block;margin:0;padding:0;border:0;background:none;border-radius:0;font-size:.7rem;font-weight:700;line-height:1.1;white-space:nowrap}
.empty{color:var(--mut);margin:0}
a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.carte,nav a,nav a::after{transition:none}.news.flash{animation:none;outline:2px solid var(--c,var(--gold))}}
footer{text-align:center;color:rgba(255,255,255,.75);font-size:.85rem;padding:12px 0 calc(28px + env(safe-area-inset-bottom,0px))}
</style>
</head>
<body>

<header class="bandeau">
  <h1 class="sr-only" id="titre"></h1>
  <img id="banniere" alt="Amicale ST93 – Solidarité, Partage, Passion">
</header>

<nav aria-label="Menu principal">
  <div class="nav-in">
    <a href="#news"><span class="nav-ico" aria-hidden="true">🆕</span>News</a>
    <a href="#agenda"><span class="nav-ico" aria-hidden="true">📆</span>Agenda</a>
    <a href="#boutique"><span class="nav-ico" aria-hidden="true">🛍️</span>Boutique</a>
    <a href="#contact"><span class="nav-ico" aria-hidden="true">✉️</span>Contact</a>
  </div>
</nav>

<div class="wrap" id="epingles-zone" hidden><div id="epingles" role="region" aria-label="News épinglées"></div></div>

<aside class="agenda-bandeau" id="agenda" aria-label="Agenda">
  <div class="agenda-inner">
    <div class="agenda-titre">📆 Prochains évènements</div>
    <div class="agenda-piste" id="agenda-liste"></div>
  </div>
</aside>

<div class="wrap">
  <section id="news-sec"><h2 id="news">🆕 News</h2><div id="news-liste"></div><nav class="pg" id="news-pages" aria-label="Pages de news" hidden></nav></section>
  <section><h2 id="boutique">🛍️ Boutique &amp; réservations</h2><div class="boutique" id="liens"></div></section>
  <section>
    <h2 id="contact">✉️ Contacter le bureau</h2>
    <p class="intro">Une question, une suggestion ? Écris-nous via le formulaire, un membre du bureau te répondra.</p>
    <div id="contact-btn"></div>
  </section>
</div>
<footer id="pied"></footer>

<dialog id="lightbox" aria-label="Image agrandie">
  <div class="lb"><button type="button" class="lb-x" aria-label="Fermer">×</button><img id="lb-img" alt=""><p id="lb-cap"></p></div>
</dialog>

<script>
/* =====================================================================
   ZONE À MODIFIER : seul ce bloc change au quotidien.
   Garde bien les guillemets "..." et les virgules entre les éléments.
   ===================================================================== */

const TITRE = "Amicale ST93";

// Bandeau en haut de page (nom du fichier image placé à côté de index.html)
const BANNIERE = "images/logo_topsite.jpeg";

// Fond d’écran : adresse d’une image, ou "" pour garder le dégradé bleu par défaut.
// Conseil : une image sombre ou floue, d’au moins 1600 px de large.
const FOND_ECRAN = "";

// Cartes de la boutique : "icone", "texte", "description" et "action" s'affichent sur la carte.
// style: "" = bleu, "alt" = rouge.
const LIENS = [
  { icone: "👕", texte: "Textiles", description: "Sweat, T-shirt", action: "Commander", url: "https://tally.so/r/OQ7Qkg", style: "" },
  { icone: "🎁", texte: "Goodies", description: "Les goodies de l'Amicale", action: "Commander", url: "https://tally.so/r/RWDxNl", style: "" },
  { icone: "🎫", texte: "Évènements", description: "Réserve ta place", action: "Réserver", url: "https://tally.so/r/EqxqgX", style: "alt" }
];

// Évènements : date au format AAAA-MM-JJ. Les dates passées disparaissent toutes seules.
// "couleur" (facultatif) : "auto" (le prochain en or, les autres en rouge), "or", "rouge", "bleu", "vert", "blanc", "violet", "turquoise" ou "orange".
const EVENEMENTS = [
  { date: "2026-12-11", titre: "Marché de Noël", details: "H.D Bobigny" },
  { date: "2026-12-25", titre: "Noël", details: "Hey! C'est Noël! HoHoHo!" },
  { date: "2026-12-31", titre: "Nouvel An!", details: "" }
// { date: "2027-03-17", titre: "Soirée Saint-Patrick", details: "Date à confirmer" },
];

// Réglages des news : nombre par page, et nombre de lignes visibles avant « Afficher toute la news ».
const NEWS_PAR_PAGE = 10;
const NEWS_LIGNES_MAX = 7;
const EPINGLES_MAX = 3;   // nombre maximum de news épinglées affichées en haut de la page

// News : la plus récente en premier. "image", "lien", "texteLien" et "couleur" (rouge, bleu, vert, blanc, violet, turquoise ou orange ; or par défaut) sont facultatifs.
// Dans "texte" : **gras**, *italique*, __souligné__, et \n pour un retour à la ligne.
// "epingle": true affiche un rappel cliquable en haut de la page (la news reste à sa place) ; "epingleJusquau": "AAAA-MM-JJ" le retire tout seul après cette date.
const NEWS = [
  {
    date: "2026-11-23",
    titre: "👕 Lancement de la fabrication de T-shirt aux couleurs de la Sûreté! 👕",
    texte: "Bientôt disponible à la vente!\nIl a été négocié auprès de notre fournisseur principal une fréquence de commande d'une par trimestre nous permettant de réduire les quantités minimums nécessaires initialement. Nous vous tiendrons informé pour la prochaine commande à venir!",
    image: "images_news/t-shirt_amicalest93.jpeg"
  },
  {
    date: "2026-11-23",
    titre: "🚧 Nouvelle version de la page web!! 🚧",
    texte: "N'hésitez pas à signaler s'il y a des petits dysfonctionnement!",
    rouge: true,
    image: "images/logo_maintenance.jpg"
  },
  {
    date: "2026-11-20",
    titre: "🎄 Marché de Noël le 11 décembre ! 🎁",
    texte: "Des séances de massage de 20 min seront proposées entre 10h et 14h par deux masseuses. Pour réserver, fais signe à un membre du bureau. Des exposants seront présents dans nos murs pour proposer leurs produits!",
    epingle: true,
    epingleJusquau: "2026-12-11",
    image: "images/logo_noel.jpeg",
    lien: "https://amst93-noel-massage.netlify.app/",
    texteLien: "Voir le planning des massages"
  }
];

// Formulaire de contact Tally (mêmes champs que les cartes de la boutique)
const CONTACT = { icone: "✉️", texte: "Contacter le bureau", description: "", action: "Écrire", url: "https://tally.so/r/Nq7pRQ" };

const PIED_DE_PAGE = "Amicale ST93";

/* ===================== FIN DE LA ZONE À MODIFIER ===================== */

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// Mise en forme du texte des news : **gras**, *italique*, __souligné__ (le reste est protégé par esc)
const riche = s => esc(s)
  .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
  .replace(/__([^_\n]+)__/g, "<u>$1</u>")
  .replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
const fmt = iso => {
  const d = new Date(iso + "T12:00:00");
  return isNaN(d) ? iso : d.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric" });
};
const $ = id => document.getElementById(id);

document.title = TITRE;
$("titre").textContent = TITRE;
if (BANNIERE) $("banniere").src = BANNIERE;
if (FOND_ECRAN) { document.body.classList.add("avec-fond"); document.body.style.backgroundImage = `url("${FOND_ECRAN}")`; }

$("liens").innerHTML = LIENS.map(l =>
  `<a class="carte ${esc(l.style)}" href="${esc(l.url)}">` +
  `<span class="carte-ico">${esc(l.icone)}</span>` +
  `<span class="carte-titre">${esc(l.texte)}</span>` +
  (l.description ? `<span class="carte-desc">${esc(l.description)}</span>` : "") +
  `<span class="carte-go">${esc(l.action || "Accéder")} →</span></a>`).join("");

const coulNews = n => n.couleur || (n.rouge ? "rouge" : "");
let pageNews = 1;
const jourNews = new Date().toLocaleDateString("sv-SE");
const epingles = NEWS.map((n, i) => ({n, i})).filter(({n}) => n.epingle && (!n.epingleJusquau || n.epingleJusquau >= jourNews)).slice(0, EPINGLES_MAX);
const epingleIdx = new Set(epingles.map(x => x.i));
const nbPages = Math.max(1, Math.ceil(NEWS.length / NEWS_PAR_PAGE));

const carteNews = (n, i) =>
  `<div class="news${n.image ? " avec-image" : ""}${coulNews(n) === "rouge" ? " rouge" : ""}${coulNews(n) && coulNews(n) !== "or" ? " c-" + esc(coulNews(n)) : ""}" id="news-${i}" tabindex="-1">` +
  (n.image ? `<figure class="news-fig"><button type="button" class="zoom" aria-label="Agrandir l’image : ${esc(n.titre)}"><img src="${esc(n.image)}" alt="${esc(n.titre)}" loading="lazy"></button><figcaption>Cliquez pour agrandir</figcaption></figure>` : "") +
  `<div class="news-corps">${epingleIdx.has(i) ? `<div class="pin">📌 Épinglé</div>` : ""}<h3>${esc(n.titre)}</h3><div class="tag">${fmt(n.date)}</div>` +
  `<div class="news-texte"><p>${riche(n.texte)}</p></div>` +
  `<button type="button" class="plus" aria-expanded="false" hidden>Afficher toute la news</button>` +
  (n.lien ? `<p><a href="${esc(n.lien)}">${esc(n.texteLien || "En savoir plus")} →</a></p>` : "") +
  `</div></div>`;

function ajusterNews() {
  document.documentElement.style.setProperty("--news-lignes", NEWS_LIGNES_MAX);
  document.querySelectorAll(".news-texte").forEach(t => {
    const bouton = t.nextElementSibling;
    if (t.classList.contains("ouvert")) { bouton.hidden = false; return; }
    t.classList.remove("coupe");
    const lh = parseFloat(getComputedStyle(t).lineHeight) || 24;
    const long = t.scrollHeight > NEWS_LIGNES_MAX * lh + 6 + lh * 1.5;
    t.classList.toggle("coupe", long);
    bouton.hidden = !long;
  });
}

function afficherNews(defiler) {
  pageNews = Math.min(Math.max(1, pageNews), nbPages);
  const debut = (pageNews - 1) * NEWS_PAR_PAGE;
  $("news-liste").innerHTML = NEWS.length ? NEWS.slice(debut, debut + NEWS_PAR_PAGE).map((n, k) => carteNews(n, debut + k)).join("") :
    `<p class="empty">Pas d’actualité pour le moment.</p>`;

  const pg = $("news-pages");
  pg.hidden = nbPages < 2;
  if (nbPages > 1) {
    let h = `<button type="button" data-p="${pageNews - 1}"${pageNews === 1 ? " disabled" : ""}>Précédent</button>`;
    for (let p = 1; p <= nbPages; p++) h += `<button type="button" data-p="${p}" aria-label="Page ${p}"${p === pageNews ? ' aria-current="page"' : ""}>${p}</button>`;
    h += `<button type="button" data-p="${pageNews + 1}"${pageNews === nbPages ? " disabled" : ""}>Suivant</button>`;
    pg.innerHTML = h;
  }
  ajusterNews();
  if (defiler) $("news-sec").scrollIntoView({block: "start"});
}

$("news-pages").addEventListener("click", e => {
  const b = e.target.closest("button[data-p]");
  if (!b || b.disabled) return;
  pageNews = +b.dataset.p; afficherNews(true);
});
const clicNews = e => {
  const z = e.target.closest(".zoom");
  if (z) {
    const im = z.querySelector("img");
    $("lb-img").src = im.currentSrc || im.src; $("lb-img").alt = im.alt; $("lb-cap").textContent = im.alt;
    $("lightbox").showModal();
    return;
  }
  const m = e.target.closest(".plus");
  if (m) {
    const ouvert = m.previousElementSibling.classList.toggle("ouvert");
    m.setAttribute("aria-expanded", ouvert);
    m.textContent = ouvert ? "Réduire la news" : "Afficher toute la news";
    if (!ouvert) m.closest(".news").scrollIntoView({block: "nearest"});
  }
};
$("news-liste").addEventListener("click", clicNews);
$("epingles").addEventListener("click", e => {
  const b = e.target.closest(".note"); if (!b) return;
  const i = +b.dataset.i, page = Math.floor(i / NEWS_PAR_PAGE) + 1;
  if (page !== pageNews) { pageNews = page; afficherNews(false); }
  const carte = $("news-" + i), plus = carte.querySelector(".plus");
  if (!plus.hidden && !plus.previousElementSibling.classList.contains("ouvert")) plus.click();
  carte.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth", block: "start"});
  carte.focus({preventScroll: true});
  carte.classList.remove("flash"); void carte.offsetWidth; carte.classList.add("flash");
});
$("lightbox").addEventListener("click", () => $("lightbox").close());
if (document.fonts) document.fonts.ready.then(ajusterNews);
let minuterie; addEventListener("resize", () => { clearTimeout(minuterie); minuterie = setTimeout(ajusterNews, 150); });
$("epingles").innerHTML = epingles.map(({n, i}) =>
  `<button type="button" class="note${coulNews(n) && coulNews(n) !== "or" ? " c-" + esc(coulNews(n)) : ""}" data-i="${i}" aria-label="Épinglé : ${esc(n.titre)}. Aller à la news">` +
  `<span class="note-pin" aria-hidden="true">📌</span><span class="note-t">${esc(n.titre)}</span><span class="note-go">Lire →</span></button>`).join("");
$("epingles-zone").hidden = !epingles.length;
afficherNews();

const aujourdhui = new Date().toLocaleDateString("sv-SE");
const aVenir = EVENEMENTS.filter(e => e.date >= aujourdhui).sort((a, b) => a.date.localeCompare(b.date));
const jourRef = new Date(aujourdhui + "T12:00:00");
$("agenda-liste").innerHTML = aVenir.length ? aVenir.map((e, i) => {
  const d = new Date(e.date + "T12:00:00");
  const jour = isNaN(d) ? "" : d.getDate();
  const mois = isNaN(d) ? "" : d.toLocaleDateString("fr-FR", { month: "short" }).replace(".", "");
  const n = isNaN(d) ? null : Math.round((d - jourRef) / 86400000);
  const delai = n === null ? "" : n === 0 ? "Aujourd'hui" : n === 1 ? "Demain" : `J-${n}`;
  const c = e.couleur || "auto";
  const cls = c === "or" || (c === "auto" && i === 0) ? " prochain" : c === "auto" || c === "rouge" ? "" : " cc c-" + esc(c);
  return `<div class="ev${cls}"><div class="ev-date"><div class="badge"><b>${jour}</b><span>${esc(mois)}</span></div>` +
    (delai ? `<span class="ev-delai">${esc(delai)}</span>` : "") + `</div>` +
    `<div class="ev-corps"><span class="ev-titre">${esc(e.titre)}</span>` +
    (e.details ? `<div class="tag">${esc(e.details)}</div>` : "") + `</div></div>`;
}).join("") : `<p class="empty">Aucun évènement programmé pour l’instant.</p>`;

$("contact-btn").innerHTML =
  `<a class="carte horizontale" href="${esc(CONTACT.url)}">` +
  `<span class="carte-ico">${esc(CONTACT.icone)}</span>` +
  `<span class="carte-corps"><span class="carte-titre">${esc(CONTACT.texte)}</span>` +
  (CONTACT.description ? `<span class="carte-desc">${esc(CONTACT.description)}</span>` : "") + `</span>` +
  `<span class="carte-go">${esc(CONTACT.action || "Écrire")} →</span></a>`;
$("pied").textContent = PIED_DE_PAGE;

/* Menu : met en évidence la rubrique en cours de lecture */
(function(){
  const nav = document.querySelector("nav");
  const liens = [...nav.querySelectorAll("a")];
  const cibles = liens.map(a => $(a.getAttribute("href").slice(1)));
  let attente = false;
  function maj(){
    attente = false;
    const seuil = nav.offsetHeight + 30;
    let actif = -1, meilleur = -Infinity;
    cibles.forEach((c, i) => {
      if (!c) return;
      const t = c.getBoundingClientRect().top;
      if (t <= seuil && t > meilleur) { meilleur = t; actif = i; }
    });
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) actif = liens.length - 1;
    liens.forEach((a, i) => i === actif ? a.setAttribute("aria-current", "true") : a.removeAttribute("aria-current"));
  }
  const demande = () => { if (!attente) { attente = true; requestAnimationFrame(maj); } };
  addEventListener("scroll", demande, { passive: true });
  addEventListener("resize", demande);
  maj();
})();
</script>
</body>
</html>
