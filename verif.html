<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vérification de carte – Amicale ST93</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#0a1228;color:#eef1f8;font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:100%;max-width:440px;text-align:center}
h1{font-size:1rem;font-weight:600;color:#d8b45c;margin:0 0 16px}
.carte{padding:26px 20px;border-radius:18px;background:#13244a;border:2px solid var(--c,#a9b4cf)}
.icone{font-size:3rem;line-height:1}
h2{margin:8px 0 14px;font-size:1.6rem;color:var(--c,#eef1f8)}
dl{margin:0;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
dt{color:#a9b4cf}dd{margin:0;font-weight:700}
p{color:#a9b4cf;font-size:.9rem}
</style></head><body><main>
<h1>Amicale ST93 · Vérification de carte de membre</h1>
<div class="carte" id="carte"><div class="icone" id="ic">🔎</div><h2 id="t">Vérification…</h2><div id="d"></div></div>
<p id="n"></p><p style="font-size:.75rem">Clé de vérification : 7ECE-1374-EC58</p>
<script>
const PUB={"kty":"EC","crv":"P-256","x":"trNGd10oSeHiqaYq6maUFsUARJUVf3lZXvkCDCTEO24","y":"Cd0yCgJ9aJodh5bmKrIokMEi75K7aSrj4sgP2fVNx1Q"}, REVOQUEES=[];
const $=i=>document.getElementById(i);
const octets=s=>Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")+"=".repeat((4-s.length%4)%4)),c=>c.charCodeAt(0));
const fr=iso=>iso.split("-").reverse().join("/");
function montrer(c,ic,t,d,n){$("carte").style.setProperty("--c",c);$("ic").textContent=ic;$("t").textContent=t;$("d").innerHTML=d||"";$("n").textContent=n||"";}
(async()=>{
  const h=location.hash.slice(1)||(window.name.startsWith("verif:")?window.name.slice(6):"");
  if(!h)return montrer("#a9b4cf","📷","Aucune carte","","Scannez le QR code d’une carte avec l’appareil photo du téléphone.");
  if(!(window.crypto&&crypto.subtle))return montrer("#ff6b5e","⚠️","Page non sécurisée","","Ouvrez cette page en https:// pour pouvoir vérifier la carte.");
  try{
    const [p,s]=h.split(".");
    const texte=new TextDecoder().decode(octets(p));
    const cle=await crypto.subtle.importKey("jwk",PUB,{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);
    const ok=await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},cle,octets(s),new TextEncoder().encode(texte));
    if(!ok)throw 0;
    const [num,nom,prenom,fin]=texte.split("|");
    const det="<dl><dt>Nom</dt><dd>"+nom+"</dd><dt>Prénom</dt><dd>"+prenom+"</dd><dt>N°</dt><dd>"+num+"</dd><dt>Valable jusqu’au</dt><dd>"+fr(fin)+"</dd></dl>";
    const note="Comparez ces informations avec la carte présentée.";
    if(REVOQUEES.includes(num))montrer("#ff6b5e","⛔","Carte révoquée",det,"Cette carte n’est plus valable.");
    else if(fin<new Date().toLocaleDateString("sv-SE"))montrer("#f0a35a","⌛","Carte expirée",det,"Validité dépassée.");
    else montrer("#5fd39a","✅","Carte valide",det,note);
  }catch(e){montrer("#ff6b5e","❌","Carte non reconnue","","Le QR code a été modifié ou n’a pas été émis par l’amicale.");}
})();
addEventListener("hashchange",()=>location.reload());
</script></main></body></html>
